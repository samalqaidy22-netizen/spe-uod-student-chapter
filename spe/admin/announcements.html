
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Announcements</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

header{
background:#003B7A;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
color:white;
text-decoration:none;
}

.container{
max-width:1100px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:30px;
}

h2{
color:#003B7A;
}

form{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

input,textarea{
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

textarea{
grid-column:1/3;
resize:vertical;
height:120px;
}

button{
background:#FDB913;
border:none;
padding:14px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#e8a900;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#003B7A;
color:white;
padding:15px;
}

td{
padding:15px;
border-bottom:1px solid #ddd;
}

.action-btn{
background:#003B7A;
color:white;
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;
}

.delete{
background:#d9534f;
}

</style>

</head>

<body>

<header>

<h2>SPE Announcements</h2>

<a href="dashboard.html">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>

</header>

<div class="container">

<div class="card">

<h2>Add Announcement</h2>

<form id="announcementForm">

<input id="title" placeholder="Announcement Title">

<input id="date" placeholder="Date">

<textarea id="description" placeholder="Announcement"></textarea>

<button type="submit">
Add Announcement
</button>

</form>

</div>

<div class="card">

<h2>Current Announcements</h2>

<table>

<thead>

<tr>

<th>Title</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="announcementList">

</tbody>

</table>

</div>

</div>

<script type="module" src="announcements.js"></script>

</body>
</html>
